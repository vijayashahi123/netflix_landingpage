<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <title>netflix landing page</title>
</head>

<body>
    <div class="first-section">
        <div class="main">
            <nav>
                <span><img src="assets/images/Netflix_Logo.png"></span>
                <div>
                      <button class="netflix-button1"> <i class="fa-solid fa-language selector"></i>
                        <select class="selector">
                            <option>English</option>
                            <option>हिन्दी</option>
                        </select>
                      </button>
                    <button class="netflix-button2">Sign In</button>
                </div>
            </nav>
            <div class="box">
                <div class="hero">
                    <span>Unlimited movies, TV<br> shows and more</span>
                    <span>Starts at ₹149. Cancel at any time.</span>
                    <span>Ready to watch? Enter your email to create or restart your membership.</span>
                    <div>
                        <input class="input1" type="text" placeholder="Email Address">
                        <button class="netflix-button3">Get Started > </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="upper-curve">

        </div>
    </div>
</body>

</html>
