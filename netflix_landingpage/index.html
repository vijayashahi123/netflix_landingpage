<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./CSS/font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">



    <title>netflix landing page</title>
</head>

<body>
    <div class="first-section">
        <div class="main">
            <div class="box"></div>
            <nav>
                <span><img src="assets/images/Netflix_Logo.png"></span>
                
                <div>
                    <button class="netflix-button1"><i class="fa fa-language" aria-hidden="true"></i>
                        <select class="selector">
                            <option>English</option>
                            <option>हिन्दी</option>
                        </select>
                    </button>
                    <button class="netflix-button2">Sign In</button>
                </div>
            </nav>
            
                <div class="hero">
                    <span>Unlimited movies, TV<br> shows and more</span>
                    <span>Starts at ₹149. Cancel at any time.</span>
                    <span>Ready to watch? Enter your email to create or restart your membership.</span>
                    <div class="pt-3">
                        <input class="input1" type="text" placeholder="Email Address">
                        <button class="netflix-button4">Get Started > </button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</body>

</html>
